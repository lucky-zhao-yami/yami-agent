[project]
name = "mcp-google-workspace"
version = "0.1.0"
description = "Google Workspace MCP Server - Docs, Drive, Slides"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]

[project.scripts]
mcp-google-workspace = "server:main"
